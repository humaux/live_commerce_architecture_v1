name: Foundation checks

on:
  # Branch pushes are covered by their pull_request run; running both doubled
  # Actions minutes per push (~27 min each, 2026-09-28). main still runs on push.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    # The full PG suite includes several real 90 s clock gates (MRR/LMR) and ran
    # past 15 min on a 4-vCPU runner (2026-09-28, run 36409672752: cancelled
    # at MRR02 with 0 FAIL). The bound must stay above test-local.sh's go test -timeout
    # (4500 s since the R2 merge, 2026-09-30) plus setup. A canonical historical-evidence
    # skip conditionally adds the registered 1700 s browser mode, so reserve 120 min while
    # still bounding a hung full-suite job.
    timeout-minutes: 120
    env:
      GOTOOLCHAIN: go1.27.2
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          # tests/foundation/live_media_stop_legacy_test.go builds a pinned
          # pre-LMR admission binary from git history; the default depth-1
          # checkout lacks that commit ("pinned pre-LMR Git source unavailable
          # exit status 128"), so fetch full history.
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Preserve evidence-validator formatting patch
        if: github.event_name == 'pull_request' && github.head_ref == 'unit/matrix-coverage-v2-evidence'
        run: |
          mkdir -p output/matrix-coverage-v2-evidence/ci-format
          gofmt -d tests/foundation/catalog_matrix_ledger_test.go tests/foundation/catalog_matrix_evidence_test.go > output/matrix-coverage-v2-evidence/ci-format/gofmt.patch || [[ -s output/matrix-coverage-v2-evidence/ci-format/gofmt.patch ]]
      - name: Evidence-validator focused integrity controls
        if: github.event_name == 'pull_request' && github.head_ref == 'unit/matrix-coverage-v2-evidence'
        run: go test ./tests/foundation -run '^TestProductEditorMatrix' -count=1 -v
      - name: Delivered patch whitespace
        if: github.event_name == 'pull_request' && github.head_ref == 'unit/matrix-coverage-v2-evidence'
        env:
          PATCH_BASE: ${{ github.event.pull_request.base.sha }}
          PATCH_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Inject a committed whitespace defect while keeping the worktree
          # clean: only the delivered base..head check can find this defect.
          probe=$(mktemp -d)
          trap 'rm -rf "$probe"' EXIT
          git -C "$probe" init -q
          git -C "$probe" config user.name ci-whitespace-probe
          git -C "$probe" config user.email ci-whitespace-probe@example.invalid
          printf 'clean\n' > "$probe/source.txt"
          git -C "$probe" add source.txt
          git -C "$probe" commit -qm base
          probe_base=$(git -C "$probe" rev-parse HEAD)
          printf 'defect \n' > "$probe/source.txt"
          git -C "$probe" add source.txt
          git -C "$probe" commit -qm injected-defect
          git -C "$probe" diff --check
          if git -C "$probe" diff --check "$probe_base..HEAD"; then
            echo 'committed whitespace injection unexpectedly passed' >&2; exit 1
          fi
          printf 'fixed\n' > "$probe/source.txt"
          git -C "$probe" add source.txt
          git -C "$probe" commit -qm fixed
          git -C "$probe" diff --check "$probe_base..HEAD"
          git diff --check "$PATCH_BASE..$PATCH_HEAD"
          printf 'delivered patch checked: %s..%s\n' "$PATCH_BASE" "$PATCH_HEAD"
      - name: Preserve evidence-validator CI diagnostics
        if: always() && github.event_name == 'pull_request' && github.head_ref == 'unit/matrix-coverage-v2-evidence'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: matrix-evidence-format
          path: output/matrix-coverage-v2-evidence/ci-format/
          if-no-files-found: error
          retention-days: 14
      - name: No key-shaped secret literals
        # Fake keys and synthetic DSNs with inline passwords must be split ("sk_" + "test_...",
        # DSN passwords in a separate const) so secret scanners never see a
        # key-shaped literal (GitGuardian false positives 2026-09-28/29). Real keys never belong here.
        # The shared webhook vector file (Go + Node cross-check, values named *_not_real_*) is exempt.
        run: |
          if git grep -nE '(sk|rk|pk)_(test|live)_[A-Za-z0-9]{8,}|whsec_[A-Za-z0-9]{8,}|EAA[A-Za-z0-9]{40,}|postgres(ql)?://[A-Za-z0-9_.-]+:[^@"$ {%]+@|postgres(ql)?://[A-Za-z0-9_.-]+:" *\+ *"[^"]*@' -- ':!*.md' ':!pnpm-lock.yaml' ':!tests/payments/stripe-webhook-vectors.json'; then
            echo "key-shaped literal found; split fake keys or remove real ones" >&2; exit 1
          fi
      - name: Dependency map is current
        # docs/engineering/dependency-map.md is generated from `go list`; a stale map
        # means a package/import changed without regenerating it (PROCESS.md §5).
        run: bash scripts/dev/depmap.sh --check
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24" # package.json engines: >=24 <25 (--experimental-strip-types)
          package-manager-cache: false # v5 auto-caches from package.json packageManager before pnpm exists; keep v4 behaviour
      - name: Node dependencies (frozen lockfile)
        # check-gates runs the W0 UI ratchet (tests/admin/shell-architecture.test.mjs, scripts/dev/ui-architecture-gate.mjs),
        # which parses TypeScript with the pinned root devDependency `typescript-api`. Before 2026-10-04 this step ran before
        # Node was set up and with no node_modules, so the ratchet could only fail (Cannot find module 'typescript-api').
        run: |
          corepack enable
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Package docs and gate map are current
        # Every Go package needs a comment with "owns" and "never" (PROCESS.md §5), and every
        # test-local.sh mode/admin spec must be documented and run by a gate (docs/delivery/GATES.md).
        run: |
          bash scripts/dev/check-pkgdocs.sh
          bash scripts/dev/check-gates.sh
      - name: Node unit suites (storefront, i18n)
        id: node-tests
        env:
          LC_MATRIX_RECEIPT_MODE: foundation
        # No Docker/PG needed. tests/media/r04-input-runner.test.mjs needs a pinned LiveKit binary and is
        # reported NOT_RUN here (never PASS); see docs/delivery/GATES.md "Node unit suites".
        run: bash scripts/dev/test-node.sh
      # PRs into r3/integration: the SAME suite (scripts/dev/test-local.sh, same -race/vet flags) already runs as the required
      # `Gates (GitHub runners) / required` check, split into shard:unit + the shard-plan.json groups. That the groups cover the whole
      # test universe exactly once is proven by check-gates.sh -> shard-plan.mjs --check (above), and every selected matrix shard must pass
      # for `required`; the gates `aggregate` job only consumes click-sweep / visual-lint evidence (PR #10 review 4212513251). Running it here serially as well duplicated ~80 min per PR and hit the 4500 s go timeout on a slow
      # runner (2026-10-07, PR #5 run 37634482705: timed out 10 s into TestStripeRF08Webhook, no assertion failed). Other events keep it.
      - name: Download pinned test image
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'r3/integration') }}
        run: docker pull postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      - name: Real PostgreSQL, race detector and vet
        id: go-tests
        if: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'r3/integration') }}
        env:
          LC_MATRIX_RECEIPT_KIND: go
          LC_MATRIX_RECEIPT_MODE: foundation
        run: bash scripts/dev/test-local.sh
      - name: Check whether canonical Go skip needs browser proof
        id: matrix-skip
        if: ${{ steps.go-tests.outcome == 'success' }}
        shell: bash
        run: env -u NODE_OPTIONS node scripts/dev/matrix-receipt-verify.mjs foundation-browser-required output/matrix-coverage-v2-execution/$GITHUB_RUN_ID/$GITHUB_JOB "${{ steps.go-tests.outcome }}" "$GITHUB_RUN_ID" "$GITHUB_SHA"
      - name: Browser requirements from registry
        id: browsers
        if: ${{ steps.matrix-skip.outputs.required == 'true' }}
        env:
          MODE: --browser-product-editor
        run: node scripts/dev/ci-playwright-browsers.mjs "$MODE"
      - name: Install Playwright browser requirements
        if: ${{ steps.matrix-skip.outputs.required == 'true' && steps.browsers.outputs.engines != '' }}
        timeout-minutes: 15
        env:
          BROWSERS: ${{ steps.browsers.outputs.engines }}
        run: |
          read -r -a browsers <<< "$BROWSERS"
          bash scripts/dev/ci-playwright-install.sh "${browsers[@]}"
      - name: Browser product editor backstop
        id: browser-tests
        if: ${{ always() && steps.matrix-skip.outputs.required == 'true' }}
        env:
          LC_MATRIX_RECEIPT_KIND: browser
          LC_MATRIX_RECEIPT_MODE: --browser-product-editor
        run: xvfb-run -a bash scripts/dev/test-local.sh --browser-product-editor
      - name: Verify current-run matrix execution receipts
        if: always()
        shell: bash
        env:
          NODE_OUTCOME: ${{ steps.node-tests.outcome }}
          GO_OUTCOME: ${{ steps.go-tests.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser-tests.outcome }}
          GO_EXPECTED: ${{ !(github.event_name == 'pull_request' && github.base_ref == 'r3/integration') }}
          LC_MATRIX_NODE_MODE: foundation
        run: env -u NODE_OPTIONS node scripts/dev/matrix-receipt-verify.mjs foundation output/matrix-coverage-v2-execution/$GITHUB_RUN_ID/$GITHUB_JOB "$NODE_OUTCOME" "$GO_OUTCOME" "$BROWSER_OUTCOME" "$GO_EXPECTED" "$GITHUB_RUN_ID" "$GITHUB_SHA"
      - name: Preserve matrix execution receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: foundation-matrix-receipts
          path: output/matrix-coverage-v2-execution/${{ github.run_id }}/foundation/
          if-no-files-found: ignore
          retention-days: 14
      - name: Reachable vulnerability scan
        # v1.1.4 bundles golang.org/x/tools v0.29.0, whose SSA builder panicked
        # ("unexpected expr: *ast.KeyValueExpr") on this module (then Go 1.27.1) in CI
        # job 108912135515 after all 725 tests passed. v1.8.0 is current.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

# Local scripts have been replayed separately. This workflow is NOT a CI pass
# until a real GitHub run supplies an execution receipt; no remote is configured.
