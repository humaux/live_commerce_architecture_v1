name: Foundation checks

on:
  # Branch pushes are covered by their pull_request run; running both doubled
  # Actions minutes per push (~27 min each, 2026-09-28). main still runs on push.
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    runs-on: ubuntu-24.04
    # The full PG suite includes several real 90 s clock gates (MRR/LMR) and ran
    # past 15 min on a 4-vCPU runner (2026-09-28, run 36409672752: cancelled
    # at MRR02 with 0 FAIL). 60 min bounds a hung run without cutting a green one.
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: go1.27.1
      GOFLAGS: -mod=readonly
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        with:
          persist-credentials: false
          # tests/foundation/live_media_stop_legacy_test.go builds a pinned
          # pre-LMR admission binary from git history; the default depth-1
          # checkout lacks that commit ("pinned pre-LMR Git source unavailable
          # exit status 128"), so fetch full history.
          fetch-depth: 0
      - uses: actions/setup-go@44694675825211faa026b3c33043df3e48a5fa00 # v6.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Dependency map is current
        # docs/engineering/dependency-map.md is generated from `go list`; a stale map
        # means a package/import changed without regenerating it (PROCESS.md §5).
        run: bash scripts/dev/depmap.sh --check
      - name: Download pinned test image
        run: docker pull postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      - name: Real PostgreSQL, race detector and vet
        run: bash scripts/dev/test-local.sh
      - name: Reachable vulnerability scan
        # v1.1.4 bundles golang.org/x/tools v0.29.0, whose SSA builder panicked
        # ("unexpected expr: *ast.KeyValueExpr") on this Go 1.27.1 module in CI
        # job 108912135515 after all 725 tests passed. v1.8.0 is current.
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

# Local scripts have been replayed separately. This workflow is NOT a CI pass
# until a real GitHub run supplies an execution receipt; no remote is configured.
