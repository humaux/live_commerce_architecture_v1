# Purpose: run G07z API acceptance on explicit dispatch, or the Stripe SANDBOX browser acceptance (SP18 real checkout.stripe.com test mode, plus SU07/SU09) on a GitHub runner
#   with the owner's Stripe TEST key (owner 2026-10-27: "GitHub 加测试密钥"; "沙盒测试每次运行都自动化，不用等我确认" -> nightly schedule on the
#   default branch r3/integration, no environment reviewer). Never on push or pull_request, so no PR code path can read the key. The key lives only in the `stripe-sandbox` environment (deployment branches: r3/integration).
# Depends on: scripts/dev/test-local.sh --stripe-browser (reads STRIPE_SECRET_KEY from LC_SECRETS_FILE, refuses anything but ^(sk|rk)_test_),
#   scripts/dev/ci-playwright-browsers.mjs + ci-playwright-install.sh (browsers), .github/actions/pnpm, the pinned postgres image (same as gates.yml).
# Used by: the integrator (`gh workflow run stripe-sandbox.yml --ref r3/integration`); evidence for contracts/stripe-psp-v1.md §14 SP18.
# Invariants: test-mode key only (a live key makes test-local.sh exit NOT_RUN before anything starts); the key is written to a 0600 file
#   under RUNNER_TEMP, never to the workspace, a log or an artifact; SP17 (webhook to a public endpoint) stays NOT_RUN here.
name: Stripe SANDBOX

on:
  workflow_call:
    inputs:
      mode:
        type: string
        required: true
      strict_receipt:
        type: boolean
        required: true
    secrets:
      STRIPE_SECRET_KEY:
        required: true
  schedule:
    # Nightly on the default branch (r3/integration), off-peak UTC and away from the gates.yml nightly (21:43).
    - cron: '17 19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "Stripe SANDBOX gate"
        type: choice
        required: true
        default: browser
        options: [browser, api]
      steps:
        description: "LC_STRIPE_BROWSER_STEPS (comma list of node-env,sp18,su07,su09; sp18 required)"
        default: "node-env,sp18,su07,su09"

permissions:
  contents: read

concurrency:
  group: stripe-sandbox
  cancel-in-progress: false

jobs:
  sandbox:
    if: >-
      github.ref == 'refs/heads/r3/integration' &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && (inputs.mode == 'browser' || inputs.mode == 'api') &&
        ((!inputs.strict_receipt && github.workflow_ref == format('{0}/.github/workflows/stripe-sandbox.yml@refs/heads/r3/integration', github.repository)) ||
         (inputs.strict_receipt && github.workflow_ref == format('{0}/.github/workflows/gates.yml@refs/heads/r3/integration', github.repository)))))
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: stripe-sandbox
    env:
      GOTOOLCHAIN: go1.27.4
      GOFLAGS: -mod=readonly
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
      MODE: --stripe-browser
    steps:
      - name: Validate steps input
        if: github.event_name == 'schedule' || inputs.mode == 'browser'
        env:
          STEPS: ${{ inputs.steps || 'node-env,sp18,su07,su09' }}
        # sp18 is mandatory: this workflow exists to produce SANDBOX evidence, a run without it must not look like one.
        run: |
          [[ "$STEPS" =~ ^(node-env|sp18|su07|su09)(,(node-env|sp18|su07|su09))*$ ]] || { echo "invalid browser steps" >&2; exit 2; }
          [[ ",$STEPS," == *,sp18,* ]] || { echo "steps must include sp18" >&2; exit 2; }
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Go modules (prefetch with retry)
        run: for i in 1 2 3; do go mod download && exit 0; echo "go mod download attempt $i failed; retrying"; sleep $((i * 15)); done; exit 1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        if: github.event_name == 'schedule' || inputs.mode == 'browser'
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: ./.github/actions/pnpm
        if: github.event_name == 'schedule' || inputs.mode == 'browser'
      - name: Node dependencies (frozen lockfile)
        if: github.event_name == 'schedule' || inputs.mode == 'browser'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Browser requirements from registry
        if: github.event_name == 'schedule' || inputs.mode == 'browser'
        id: browsers
        run: node scripts/dev/ci-playwright-browsers.mjs "$MODE"
      - name: Writable Playwright browser dir
        if: github.event_name == 'schedule' || inputs.mode == 'browser'
        run: sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" && sudo chown "$(id -u):$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH"
      - name: Browsers
        if: github.event_name == 'schedule' || inputs.mode == 'browser'
        timeout-minutes: 15
        env:
          BROWSERS: ${{ steps.browsers.outputs.engines }}
          LC_PLAYWRIGHT_DEBS_DIR: ${{ runner.temp }}/playwright-debs
        run: |
          read -r -a browsers <<< "$BROWSERS"
          bash scripts/dev/ci-playwright-install.sh "${browsers[@]}"
      - name: Download pinned test image
        run: docker pull postgres@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
      - name: Compile API probes without credentials
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'api'
        run: |
          mkdir "$RUNNER_TEMP/g07z-bin"
          go test -c -o "$RUNNER_TEMP/g07z-bin/stripe.test" ./internal/integrations/psp/stripe
          go test -race -c -o "$RUNNER_TEMP/g07z-bin/foundation.test" ./tests/foundation
          cat > "$RUNNER_TEMP/g07z-bin/run" <<'SH'
          #!/usr/bin/env bash
          set -eu
          source "$LC_SECRETS_FILE"
          export STRIPE_SECRET_KEY STRIPE_SANDBOX=1 STRIPE_ACCOUNT_ID=acct_1UJDb0RusP6Wwj7e
          exec "$@"
          SH
          chmod 700 "$RUNNER_TEMP/g07z-bin/run"
      - name: API sandbox gate (G07z)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'api'
        env:
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRICT_RECEIPT: ${{ inputs.strict_receipt }}
        run: |
          umask 077
          [[ "$STRIPE_TEST_KEY" =~ ^(sk|rk)_test_[[:alnum:]]+$ ]] || { echo "Stripe test key required" >&2; exit 2; }
          export TMPDIR="$RUNNER_TEMP/g07z-private"
          mkdir "$TMPDIR"
          trap 'rm -rf "$TMPDIR"' EXIT
          export LC_SECRETS_FILE="$TMPDIR/secrets.env" LC_RELEASE_GATE_OUT="$TMPDIR/gate"
          printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_TEST_KEY" > "$LC_SECRETS_FILE"
          unset STRIPE_TEST_KEY
          export LC_G07Z_BIN_DIR="$RUNNER_TEMP/g07z-bin"
          STRIPE_BROWSER=1 STRIPE_SANDBOX=1 bash scripts/dev/release-gate.sh --strict --only G07z >"$TMPDIR/console" 2>&1 || {
            rc=$?; echo "G07z failed (strict gate exit $rc)" >&2; exit "$rc"
          }
          # Project only the gate identity and status from its summary. Notes and logs stay private.
          mkdir -p output/g07z
          awk -F '\t' -v sha="$GITHUB_SHA" '$1=="G07z" && $2=="SANDBOX" && $3=="PASS" && $5=="0" {
            print $1, $2, $3, "SP16 RF10 SP21/sandbox_probe_against_real_stripe", sha; found++
          } END { exit found != 1 }' "$LC_RELEASE_GATE_OUT/results.tsv" > output/g07z/result.txt
          rm -f "$LC_SECRETS_FILE"
          if [[ "$STRICT_RECEIPT" == true ]]; then
            python3 scripts/dev/strict-release-evidence.py project-api "$LC_RELEASE_GATE_OUT" output/g07z/probes.json
          fi
      - name: SANDBOX gate
        if: github.event_name == 'schedule' || inputs.mode == 'browser'
        id: gate
        env:
          STRIPE_TEST_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          LC_STRIPE_BROWSER_STEPS: ${{ inputs.steps || 'node-env,sp18,su07,su09' }}
        run: |
          set -o pipefail
          # The key reaches test-local.sh only through a 0600 file outside the workspace; drop it from this shell's env first.
          [[ "$STRIPE_TEST_KEY" =~ ^(sk|rk)_test_[[:alnum:]]+$ ]] || { echo "Stripe test key required" >&2; exit 2; }
          umask 077
          secrets_file="$RUNNER_TEMP/secrets.env"
          printf 'STRIPE_SECRET_KEY=%s\n' "$STRIPE_TEST_KEY" > "$secrets_file"
          unset STRIPE_TEST_KEY
          mkdir -p output/playwright
          export LC_BROWSER_EVIDENCE_ROOT="$(mktemp -d "$PWD/output/playwright/run.XXXXXXXX")"
          mkdir -p "$LC_BROWSER_EVIDENCE_ROOT/ci-gates"
          LC_SECRETS_FILE="$secrets_file" STRIPE_BROWSER=1 STRIPE_SANDBOX=1 \
            xvfb-run -a bash scripts/dev/test-local.sh "$MODE" 2>&1 | tee "$LC_BROWSER_EVIDENCE_ROOT/ci-gates/stripe-browser.log"
      - name: Remove key file
        if: always()
        run: rm -f "$RUNNER_TEMP/secrets.env"
      - name: Failure summary
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'browser')
        run: grep -hE '^--- FAIL|^FAIL|NOT_RUN|^PASS' output/playwright/*/ci-gates/*.log | head -100 || true
      # Log masking does not cover artifacts: refuse to upload evidence that contains any Stripe secret-key-shaped string.
      - name: Secret scan of evidence
        id: scan
        if: (always() && inputs.mode != 'api') || success()
        env:
          EVIDENCE: ${{ inputs.mode == 'api' && 'output/g07z' || 'output/playwright' }}
        run: |
          # Exactly "no match" (grep exit 1) passes; a hit (0) or a scan error (2) blocks the upload. -R follows symlinks like the upload does.
          rc=0; grep -RlE '(sk|rk)_(test|live)_[A-Za-z0-9]{10,}' "$EVIDENCE" >/dev/null || rc=$?
          if [[ $rc == 0 ]]; then echo "evidence contains a Stripe key-shaped string; not uploading" >&2; exit 1; fi
          if [[ $rc != 1 ]]; then echo "secret scan error (grep exit $rc); not uploading" >&2; exit 1; fi
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: native_artifact
        if: always() && steps.scan.outcome == 'success'
        with:
          name: ${{ inputs.strict_receipt && format('strict-{0}-a{1}-native', inputs.mode, github.run_attempt) || format('stripe-sandbox-evidence-{0}-{1}', github.sha, github.run_attempt) }}
          path: ${{ inputs.mode == 'api' && 'output/g07z/' || 'output/playwright/' }}
          retention-days: 30
          if-no-files-found: error
      - name: Bind Stripe native evidence
        if: inputs.strict_receipt
        env:
          STRICT_MODE: ${{ inputs.mode }}
          ARTIFACT_ID: ${{ steps.native_artifact.outputs.artifact-id }}
          ARTIFACT_DIGEST: ${{ steps.native_artifact.outputs.artifact-digest }}
        run: |
          if [[ "$STRICT_MODE" == api ]]; then
            source=output/g07z/probes.json
          else
            logs=(output/playwright/*/ci-gates/stripe-browser.log)
            [[ "${#logs[@]}" == 1 && -f "${logs[0]}" ]]
            source="${logs[0]}"
          fi
          python3 scripts/dev/strict-release-evidence.py seal "$STRICT_MODE" "$RUNNER_TEMP/strict-child" "$ARTIFACT_ID" "sha256:${ARTIFACT_DIGEST#sha256:}" "$source"
      - name: Sign strict child receipt
        if: inputs.strict_receipt
        id: attestation
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: ${{ runner.temp }}/strict-child/receipt.json
      - name: Include signature bundle
        if: inputs.strict_receipt
        env:
          BUNDLE: ${{ steps.attestation.outputs.bundle-path }}
          RECEIPT: ${{ runner.temp }}/strict-child
        run: cp "$BUNDLE" "$RECEIPT/attestation.json"
      - name: Upload strict child receipt
        if: inputs.strict_receipt
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: strict-${{ inputs.mode }}-a${{ github.run_attempt }}
          path: ${{ runner.temp }}/strict-child/
          if-no-files-found: error
          retention-days: 30
