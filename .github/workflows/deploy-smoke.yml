# Disposable G14 evidence job. This workflow lives only on the scan branch.
# The checkout and all build inputs are pinned separately to the tested PR tree.
name: G14 isolated image evidence
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      G14_SOURCE_SHA: 913b5a54bbc7d0ab854f521bd42945f26e95541b
      G14_SOURCE_TREE: fe2ca007d953700a369d5899fc5179c65a43aa41
      LC_BUILD_PRUNE: "0"
      LC_PLATFORM_HOST: platform.localhost
      LC_ADMIN_HOST: admin.localhost
      LC_COMPANY_CONTACT_EMAIL: contact@example.invalid
      SYFT_CHECK_FOR_APP_UPDATE: "false"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ env.G14_SOURCE_SHA }}
          persist-credentials: false
      - name: Verify source and official scanner releases
        shell: bash
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/g14-image-evidence"
          tools="$RUNNER_TEMP/g14-tools"
          mkdir -p "$ev" "$tools"
          test "$(git rev-parse HEAD)" = "$G14_SOURCE_SHA"
          test "$(git rev-parse 'HEAD^{tree}')" = "$G14_SOURCE_TREE"
          test -z "$(git status --porcelain)"
          {
            printf 'checkout_sha=%s\ncheckout_tree=%s\nworkflow_sha=%s\nrun_id=%s\nrun_attempt=%s\n' \
              "$G14_SOURCE_SHA" "$G14_SOURCE_TREE" "$GITHUB_WORKFLOW_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            uname -srm
            docker version --format '{{json .Server}}'
          } > "$ev/build-identity.txt"

          install_scanner() {
            local repo=$1 version=$2 asset=$3 hash=$4 binary=$5
            curl --fail --silent --show-error --location --retry 2 --max-time 150 \
              "https://github.com/$repo/releases/download/$version/$asset" -o "$tools/$asset"
            printf '%s  %s\n' "$hash" "$tools/$asset" | sha256sum -c | tee -a "$ev/scanner-downloads.log"
            tar -xf "$tools/$asset" -C "$tools" "$binary"
            "$tools/$binary" --version >> "$ev/scanner-versions.log"
          }
          install_scanner anchore/syft v1.57.2 syft_1.57.2_linux_amd64.tar.gz ad92bd3ec1b94a3df01d4d0aec199afa9c42b72e86da436ff5f837914d32706b syft
          install_scanner aquasecurity/trivy v0.76.2 trivy_0.76.2_Linux-64bit.tar.gz bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf trivy
      - name: Build four images in the isolated runner
        shell: bash
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/g14-image-evidence"
          bash deploy/scripts/check-pins.sh | tee "$ev/pin-check.log"
          bash deploy/scripts/build-images.sh --tag "smoke-${G14_SOURCE_SHA:0:12}" --evidence "$ev" 2>&1 | tee "$ev/build.log"
      - name: Collect image SBOM, licenses, and vulnerability scans
        shell: bash
        run: |
          set -euo pipefail
          ev="$RUNNER_TEMP/g14-image-evidence"
          tools="$RUNNER_TEMP/g14-tools"
          local_cache="$RUNNER_TEMP/g14-trivy-cache"
          jq -es --arg rev "$G14_SOURCE_SHA" 'length == 4 and all(.[]; .revision == $rev)' "$ev/images.jsonl"
          cd "$RUNNER_TEMP"
          "$tools/trivy" image --cache-dir "$local_cache" --timeout 8m --download-db-only > "$ev/trivy-db.log" 2>&1
          if [[ -f "$local_cache/db/metadata.json" ]]; then
            cp "$local_cache/db/metadata.json" "$ev/trivy-db-metadata.json"
          fi
          status=0
          for unit in go admin storefront caddy; do
            tag="lc-$unit:smoke-${G14_SOURCE_SHA:0:12}"
            id=$(docker image inspect --format '{{.Id}}' "$tag")
            jq -es --arg tag "$tag" --arg id "$id" 'any(.[]; .image == $tag and .id == $id)' "$ev/images.jsonl"
            docker image inspect "$id" --format '{"Id":"{{.Id}}","RepoTags":{{json .RepoTags}},"RepoDigests":{{json .RepoDigests}},"Os":"{{.Os}}","Architecture":"{{.Architecture}}","RootFS":{{json .RootFS}},"Revision":{{json (index .Config.Labels "org.opencontainers.image.revision")}}}' > "$ev/$unit.inspect.json"
            code=0
            timeout 8m "$tools/syft" scan "docker:$tag" -o "syft-json=$ev/$unit.syft.json" -o "spdx-json=$ev/$unit.spdx.json" > "$ev/$unit.syft.log" 2>&1 || code=$?
            echo "$code" > "$ev/$unit.syft.exit"
            if ((code != 0)); then status=1; fi
            code=0
            timeout 10m "$tools/trivy" image --image-src docker --cache-dir "$local_cache" --skip-db-update \
              --timeout 9m --scanners vuln,license --license-full --format json \
              --output "$ev/$unit.trivy.json" "$tag" > "$ev/$unit.trivy.log" 2>&1 || code=$?
            echo "$code" > "$ev/$unit.trivy.exit"
            if ((code != 0)); then status=1; fi
            test "$(docker image inspect --format '{{.Id}}' "$tag")" = "$id"
          done
          exit "$status"
      - name: Checksum original evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/g14-image-evidence"
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Upload original image evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: g14-native-image-evidence
          path: ${{ runner.temp }}/g14-image-evidence/
          if-no-files-found: error
          retention-days: 14
