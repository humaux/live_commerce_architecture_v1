name: Deploy smoke

# R1 ruling G3 (docs/delivery/units/r1-final-rulings.md): deploy/scripts/smoke.sh static (S01 shellcheck
# is preinstalled on ubuntu-24.04) and smoke.sh full (the whole compose stack as root with Docker) run on
# a Linux runner instead of a developer machine. Same triggers as foundation.yml; workflow_dispatch lets
# the integrator get a receipt for a branch before its PR run.
# PRs into r3/integration do NOT trigger this workflow directly: gates.yml calls it (workflow_call) only when deploy/ or scripts/deploy* changed, so `Gates (GitHub runners) / required`
# waits for it and a UI-only PR does not pay ~50 min of image builds. PRs into any other branch keep the old pull_request trigger.
on:
  push:
    branches: [main]
  pull_request:
    branches-ignore: [r3/integration]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: deploy-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    # Cold image builds (lc-go, admin, storefront, caddy) dominate; the cases themselves take ~5 min.
    timeout-minutes: 50
    env:
      GOTOOLCHAIN: go1.27.2
      GOFLAGS: -mod=readonly
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Free runner disk for the image builds
        # preflight P13 (deploy/scripts/preflight.sh) requires >= 20 % free on the docker root and the backup
        # dir; the stock runner image ships ~30 GB of SDKs this job never uses. Removing them is runner prep,
        # the P13 threshold is unchanged.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h / /tmp
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24" # package.json engines: >=24 <25
          package-manager-cache: false # v5 auto-caches from package.json packageManager before pnpm exists; keep v4 behaviour
      - name: Repo Playwright + Chromium for S34
        # S34 drives Chromium through the edge; without the repo's @playwright/test it is NOT_RUN.
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH" && sudo chown "$(id -u)" "$PLAYWRIGHT_BROWSERS_PATH"
          pnpm exec playwright install --with-deps chromium
      - name: smoke.sh static (S01-S06)
        run: |
          rc=0
          python3 .github/scripts/smoke-verdict.py --selftest
          bash deploy/scripts/smoke.sh static || rc=$?
          ev=$(ls -td deploy/.evidence/*/ | head -n1)
          python3 .github/scripts/smoke-verdict.py "$ev/result.json" "$rc" static
      - name: smoke.sh full (S07-S45, as root)
        # Exit contract of smoke.sh: 0 PASS, 1 FAIL, 3 BLOCKED. BLOCKED is accepted only for S29m (ruling
        # F11: logical-restore media gate, LiveKit media is not in R1); smoke-verdict.py fails the job on
        # any FAIL, any other BLOCKED, a case that never ran, or a NOT_RUN. Logs contain only CASE lines;
        # the temp secrets are generated per run, secret-scanned and deleted by smoke.sh itself.
        run: |
          rc=0
          sudo --preserve-env=GOTOOLCHAIN,GOFLAGS,PLAYWRIGHT_BROWSERS_PATH env "PATH=$PATH" "HOME=$HOME" \
            bash deploy/scripts/smoke.sh full || rc=$?
          ev=$(ls -td deploy/.evidence/*/ | head -n1)
          # preflight prints rule ids and names only, never values: show why a preflight-gated case failed.
          sudo grep -hE '^P[0-9]+[a-z]? (FAIL|WARN) ' "$ev"/logs/S10.log "$ev"/logs/S37.log 2>/dev/null | sort -u || true
          # Why a case FAILED: the tail of its own log. smoke.sh secret-scans every evidence log against the per-run generated
          # secrets before it exits, so these tails carry no secret (2026-10-04: S37 failed with no visible cause).
          sudo awk -F'\t' '$2 == "FAIL" { print $1 }' "$ev/cases.tsv" 2>/dev/null | while read -r id; do
            echo "::group::$id.log (last 60 lines)"; sudo tail -n 60 "$ev/logs/$id.log" 2>/dev/null || true; echo "::endgroup::"
          done || true
          # S40 (log redaction): which container wrote a canary, with the random canary masked (it is test data, not a secret).
          sudo grep -h 'lcCanary' "$ev/logs/S40-compose.log" 2>/dev/null | sed -E 's/lcCanary[0-9a-f]+/<CANARY>/g' | cut -c1-600 | head -n 20 || true
          sudo chmod -R a+rX deploy/.evidence || true # root-owned evidence was unreadable for the upload step
          python3 .github/scripts/smoke-verdict.py "$ev/result.json" "$rc" full
      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: deploy-smoke-evidence
          path: |
            deploy/.evidence/*/result.json
            deploy/.evidence/*/cases.tsv
            deploy/.evidence/*/commands.tsv
          include-hidden-files: true # .evidence is a hidden dir; upload-artifact >=4.4 skips it by default
          retention-days: 14
